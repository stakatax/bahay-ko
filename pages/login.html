<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <title>Login Page</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="flex items-center justify-center min-h-screen">

  <!-- Outer Container with Glow -->
  <div class="glow-border p-10 rounded-xl">

    <!-- Card -->
    <div class="bg-[#ffffff] rounded-3xl w-[420px] px-10 py-12 card-shadow text-center">

      <!-- Logo -->
      <div class="flex justify-center mb-4">
        <img src="ulsco.png" alt="Logo" class="w-20 h-20 object-contain">
      </div>

      <!-- Title -->
      <h2 class="text-[18px] font-bold text-gray-800 mb-8">
        Have an account?
      </h2>

      <!-- Username -->
      <input type="text" placeholder="Username"
        class="input-style w-full mb-5 outline-none">

      <!-- Password -->
      <input type="password" placeholder="Password"
        class="input-style w-full mb-6 outline-none">

      <!-- Options -->
      <div class="flex justify-between items-center text-[13px] mb-8 px-1">
        <label class="flex items-center gap-2 text-[#7a2e2e]">
          <input type="checkbox" class="accent-[#7a2e2e]">
          Remember me
        </label>

        <a href="#" class="text-[#7a2e2e] underline">
          Forgot Password
        </a>
      </div>

      <!-- Button -->
      <button class="btn-main w-full">
        Get Started
      </button>

    </div>
  </div>



</body>
</html>
