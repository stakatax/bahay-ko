ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
<LocationMatch "(?i)^/(?:app|config|include|pages|vendor|scripts|database|dev|docs|tests|logs|deployment|private)(?:/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "(?i)(?:^|/)\.(?!well-known(?:/|$))">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(?:\.(?:env|ini|log|sql|bak|backup|old|example|md|zip|tar|gz|7z|pem|key|p12|pfx)$|^(?:composer\.(?:json|lock)|Dockerfile|docker-compose\.yaml|AGENTS\.md|rule\.md)$)">
    Require all denied
</FilesMatch>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
# Generated at startup from validated, operator-confirmed proxy CIDRs.
IncludeOptional /run/olshco/proxy.conf
